<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDG QA Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{
  --bg:#0f1117;--surface:#161b27;--surface2:#1e2535;--border:#2a3347;
  --text:#e2e8f0;--text2:#8b95a9;--accent:#5b8af5;--accent-h:#4a79e4;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
  --sw:230px;
}
body{background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto}

/* Sidebar */
.brand{padding:20px 20px 12px}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--text2);margin-top:2px}
.nav{flex:1;padding:4px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:14px;font-weight:500;text-decoration:none;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(91,138,245,.15);color:var(--accent)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;margin-top:2px}
.role-admin{color:var(--accent)}
.role-user{color:var(--text2)}
.btn-logout{background:none;border:none;cursor:pointer;color:var(--text2);padding:6px;border-radius:6px;transition:all .15s;display:flex;align-items:center}
.btn-logout:hover{background:var(--surface2);color:var(--red)}

/* Pages */
.page{padding:32px 36px}
.page.hidden{display:none}
.ph{display:flex;align-items:center;margin-bottom:28px}
.ph h1{font-size:22px;font-weight:700;flex:1}
.ph-actions{display:flex;gap:10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-h)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 12px;font-size:13px}

/* Tables */
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover:not(.expand-row){background:var(--surface)}
tbody td{padding:13px 16px;font-size:14px;vertical-align:middle}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-passed{background:rgba(34,197,94,.12);color:var(--green)}
.badge-failed{background:rgba(239,68,68,.12);color:var(--red)}
.badge-running{background:rgba(245,158,11,.12);color:var(--yellow)}

/* Active run card */
.run-card{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.04);border-radius:10px;padding:20px;margin-bottom:28px}
.run-card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.run-dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.run-card-title{font-size:15px;font-weight:600;flex:1}
.run-card-sub{font-size:13px;color:var(--text2)}

/* Log */
.log{background:#090b10;border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:#b0bcc8;line-height:1.7;height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.log-sm{height:180px}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;min-width:460px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;margin-bottom:22px}
.modal-title{font-size:18px;font-weight:700;flex:1}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:24px;line-height:1;padding:2px;border-radius:4px;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px}

/* Browser pills */
.bpills{display:flex;gap:8px;flex-wrap:wrap}
.bpill{padding:6px 16px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;background:none}
.bpill.active{border-color:var(--accent);color:var(--accent);background:rgba(91,138,245,.1)}

/* Groups */
.groups-list{display:flex;flex-direction:column;gap:10px}
.group-item{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.group-hdr{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface2)}
.group-hdr input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.group-lbl{font-size:14px;font-weight:600;flex:1;cursor:pointer}
.group-count{font-size:12px;color:var(--text2)}
.group-tests{padding:8px 14px 10px 42px;display:flex;flex-direction:column;gap:3px}
.group-test{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.group-test::before{content:'·';color:var(--border)}

/* Detail view */
.detail-back{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:14px;cursor:pointer;background:none;border:none;margin-bottom:22px;padding:0;transition:color .15s}
.detail-back:hover{color:var(--text)}
.detail-back svg{width:15px;height:15px}
.detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.detail-hdr h2{font-size:20px;font-weight:700;flex:1}

/* Editor */
.editor-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;height:430px}
#monacoContainer{height:100%}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:8px;font-size:14px;font-weight:500;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:tIn .2s ease}
.t-success{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.t-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.t-info{background:rgba(91,138,245,.15);border:1px solid rgba(91,138,245,.3);color:var(--accent)}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Misc */
.empty{text-align:center;padding:56px 20px;color:var(--text2);font-size:14px}
.empty-ico{font-size:36px;margin-bottom:10px}
.c-muted{color:var(--text2)}.c-green{color:var(--green)}.c-red{color:var(--red)}
.expand-row td{padding:0}
.expand-inner{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface)}
.results-table{width:100%;border-collapse:collapse}
.results-table th{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;padding:6px 10px;text-align:left}
.results-table td{padding:7px 10px;font-size:13px;border-top:1px solid var(--border)}
.expandable{cursor:pointer}
.exc{color:var(--text2);font-size:11px;user-select:none}
.lbl-sec{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-name">WDG QA</div>
    <div class="brand-sub">Autotest Management</div>
  </div>
  <nav class="nav">
    <button class="nav-item active" data-page="runs" onclick="navigate('runs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Runs
    </button>
    <button class="nav-item" data-page="plans" onclick="navigate('plans')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Test Plans
    </button>
    <button class="nav-item admin-only" data-page="autotests" onclick="navigate('autotests')" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Autotests
    </button>
    <button class="nav-item" data-page="history" onclick="navigate('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
  </nav>
  <div class="sidebar-foot">
    <div class="user-info">
      <div class="user-name" id="uName">—</div>
      <div class="user-role"><span id="uRole">—</span></div>
    </div>
    <button class="btn-logout" onclick="logout()" title="Sign out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- RUNS PAGE -->
<div id="page-runs" class="page">
  <div class="ph">
    <h1>Runs</h1>
    <div class="ph-actions">
      <button class="btn btn-primary" onclick="openRunModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Run
      </button>
    </div>
  </div>
  <div id="activeRunCard" class="run-card" style="display:none">
    <div class="run-card-hdr">
      <div class="run-dot"></div>
      <div>
        <div class="run-card-title" id="rcTitle">Running...</div>
        <div class="run-card-sub" id="rcSub"></div>
      </div>
    </div>
    <div class="log" id="rcLog"></div>
  </div>
  <div id="runsWrap"><div class="empty"><div class="empty-ico">▷</div>No runs yet. Click New Run to start.</div></div>
</div>

<!-- PLANS PAGE -->
<div id="page-plans" class="page hidden">
  <div id="plans-list">
    <div class="ph">
      <h1>Test Plans</h1>
      <div class="ph-actions">
        <button class="btn btn-primary" onclick="openNewPlanModal()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Plan
        </button>
      </div>
    </div>
    <div id="plansWrap"><div class="empty">No plans yet</div></div>
  </div>
  <div id="plans-detail" style="display:none">
    <button class="detail-back" onclick="closePlanDetail()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Test Plans
    </button>
    <div class="detail-hdr">
      <h2 id="pdName"></h2>
      <button class="btn btn-ghost btn-sm" onclick="savePlanDetail()">Save</button>
      <button class="btn btn-primary btn-sm" onclick="runPlanDetail()">▶ Run</button>
      <button class="btn btn-danger btn-sm" onclick="deletePlanDetail()">Delete</button>
    </div>
    <p id="pdDesc" style="color:var(--text2);font-size:14px;margin-bottom:24px"></p>
    <div class="field" style="max-width:220px;margin-bottom:26px">
      <label>Default Browser</label>
      <select id="pdBrowser">
        <option value="all">All Browsers</option>
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
      </select>
    </div>
    <div class="lbl-sec">Test Groups</div>
    <div id="pdGroups" class="groups-list"></div>
  </div>
</div>

<!-- AUTOTESTS PAGE -->
<div id="page-autotests" class="page hidden">
  <div id="at-list">
    <div class="ph">
      <h1>Autotests</h1>
      <div class="ph-actions">
        <button class="btn btn-primary" onclick="createAutotest()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Autotest
        </button>
      </div>
    </div>
    <div id="atWrap"><div class="empty"><div class="empty-ico">⌨</div>No autotests yet</div></div>
  </div>
  <div id="at-detail" style="display:none">
    <button class="detail-back" onclick="closeAtDetail()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Autotests
    </button>
    <div class="detail-hdr">
      <input id="atName" placeholder="Test name" style="flex:1;padding:9px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-weight:600;outline:none;min-width:0">
      <button class="btn btn-ghost btn-sm" onclick="saveAutotest()">Save</button>
      <button class="btn btn-primary btn-sm" id="atRunBtn" onclick="runAutotestNow()">▶ Run</button>
      <button class="btn btn-danger btn-sm" onclick="deleteAtCurrent()">Delete</button>
    </div>
    <div class="field" style="max-width:240px;margin-bottom:14px">
      <label>Language</label>
      <select id="atLang" onchange="updateEditorLang()">
        <option value="javascript">JavaScript / Playwright</option>
        <option value="typescript">TypeScript / Playwright</option>
        <option value="python">Python</option>
      </select>
    </div>
    <div class="editor-wrap">
      <div id="monacoContainer"></div>
    </div>
    <div id="atRunResult" style="display:none;margin-top:16px">
      <div class="lbl-sec" style="margin-bottom:8px">Run Output</div>
      <div class="log log-sm" id="atRunLog"></div>
    </div>
  </div>
</div>

<!-- HISTORY PAGE -->
<div id="page-history" class="page hidden">
  <div class="ph">
    <h1>History</h1>
    <div class="ph-actions">
      <button class="btn btn-ghost btn-sm" onclick="loadHistory()">↻ Refresh</button>
    </div>
  </div>
  <div id="histWrap"><div class="empty">No history yet</div></div>
</div>

</main>
</div>

<!-- RUN MODAL -->
<div id="runModal" class="overlay hidden">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title">New Run</div>
      <button class="modal-close" onclick="closeRunModal()">×</button>
    </div>
    <div class="field">
      <label>Test Plan</label>
      <select id="runPlanSel"></select>
    </div>
    <div class="field">
      <label>Browser</label>
      <div class="bpills" id="runBpills">
        <button class="bpill active" data-b="all" onclick="pickBrowser(this,'runBpills')">All</button>
        <button class="bpill" data-b="chrome" onclick="pickBrowser(this,'runBpills')">Chrome</button>
        <button class="bpill" data-b="firefox" onclick="pickBrowser(this,'runBpills')">Firefox</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeRunModal()">Cancel</button>
      <button class="btn btn-primary" onclick="startRun()">▶ Start Run</button>
    </div>
  </div>
</div>

<!-- NEW PLAN MODAL -->
<div id="newPlanModal" class="overlay hidden">
  <div class="modal" style="max-width:640px">
    <div class="modal-hdr">
      <div class="modal-title">New Test Plan</div>
      <button class="modal-close" onclick="closeNewPlanModal()">×</button>
    </div>
    <div class="field">
      <label>Name</label>
      <input id="npName" placeholder="Smoke, Regression, Sprint 12…" onkeydown="if(event.key==='Enter')createPlan()">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="npDesc" placeholder="What does this plan test?"></textarea>
    </div>
    <div class="field">
      <label>Browser</label>
      <div class="bpills" id="npBpills">
        <button class="bpill" data-b="all" onclick="pickBrowser(this,'npBpills')">All</button>
        <button class="bpill active" data-b="chrome" onclick="pickBrowser(this,'npBpills')">Chrome</button>
        <button class="bpill" data-b="firefox" onclick="pickBrowser(this,'npBpills')">Firefox</button>
      </div>
    </div>
    <div class="field">
      <label>Test Groups</label>
      <div id="npGroups" class="groups-list"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeNewPlanModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createPlan()">Create Plan</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Monaco CDN -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
<script>
'use strict';

/* ===== STATE ===== */
let currentUser = { username: '', role: 'user' };
let groups = [];
let plans = [];
let runs = [];
let autotests = [];
let currentPlanId = null;
let currentAtId = null;
let monacoReady = false;
let monacoEditor = null;
let sseSource = null;
let runBrowser = 'all';

/* ===== INIT ===== */
async function init() {
  try {
    currentUser = await api('/api/me');
    document.getElementById('uName').textContent = currentUser.username;
    const roleEl = document.getElementById('uRole');
    const role = currentUser.role || 'user';
    roleEl.textContent = role;
    roleEl.className = role === 'admin' ? 'role-admin' : 'role-user';

    if (role === 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
    }

    [groups, plans] = await Promise.all([
      api('/api/plans/available-groups'),
      api('/api/plans'),
    ]);

    navigate('runs');
  } catch { window.location.href = '/login'; }
}

/* ===== NAVIGATION ===== */
function navigate(page) {
  if (page === 'autotests' && currentUser.role !== 'admin') return;

  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  document.querySelectorAll('.page').forEach(el =>
    el.classList.toggle('hidden', el.id !== `page-${page}`));

  if (page === 'runs')      loadRuns();
  if (page === 'plans')     renderPlans();
  if (page === 'autotests') loadAutotests();
  if (page === 'history')   loadHistory();
}

/* ===== RUNS ===== */
async function loadRuns() {
  runs = await api('/api/runs');
  renderRuns();
  try {
    const status = await api('/api/run/status');
    if (status.running) connectSSE();
  } catch {}
}

function renderRuns() {
  const w = document.getElementById('runsWrap');
  if (!runs.length) {
    w.innerHTML = '<div class="empty"><div class="empty-ico">▷</div>No runs yet. Click New Run to start.</div>';
    return;
  }
  w.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Plan</th><th>Browser</th><th>Status</th><th>✓</th><th>✗</th><th>Duration</th><th>Started</th><th>By</th></tr></thead>
    <tbody>${runs.map((r, i) => `<tr>
      <td class="c-muted">${runs.length - i}</td>
      <td><strong>${esc(r.group || 'All Tests')}</strong></td>
      <td class="c-muted">${bicon(r.browser)} ${esc(r.browser || 'all')}</td>
      <td>${sbadge(r.status)}</td>
      <td class="c-green">${r.passed ?? '—'}</td>
      <td class="c-red">${r.failed ?? '—'}</td>
      <td class="c-muted">${r.duration || '—'}</td>
      <td class="c-muted" style="font-size:12px">${fdate(r.startedAt)}</td>
      <td class="c-muted">${esc(r.triggeredBy || '—')}</td>
    </tr>`).join('')}
    </tbody></table></div>`;
}

function openRunModal() {
  const sel = document.getElementById('runPlanSel');
  sel.innerHTML = '<option value="">— Select a plan —</option>' +
    plans.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  runBrowser = 'all';
  document.querySelectorAll('#runBpills .bpill').forEach(b =>
    b.classList.toggle('active', b.dataset.b === 'all'));
  document.getElementById('runModal').classList.remove('hidden');
}
function closeRunModal() { document.getElementById('runModal').classList.add('hidden'); }

async function startRun() {
  const planId = document.getElementById('runPlanSel').value;
  if (!planId) { toast('Select a test plan', 'error'); return; }
  closeRunModal();
  try {
    const plan = plans.find(p => p.id === planId);
    await api(`/api/plans/${planId}/run`, 'POST', { browser: runBrowser });
    showRunCard(plan?.name || planId, runBrowser);
    connectSSE();
    toast('Run started', 'success');
    runs = await api('/api/runs');
    renderRuns();
  } catch(e) { toast(e.message || 'Failed to start run', 'error'); }
}

function showRunCard(title, browser) {
  document.getElementById('activeRunCard').style.display = 'block';
  document.getElementById('rcTitle').textContent = title;
  document.getElementById('rcSub').textContent = 'Browser: ' + (browser || 'all');
  document.getElementById('rcLog').textContent = '';
}

function connectSSE() {
  if (sseSource) { sseSource.close(); sseSource = null; }
  const logEl = document.getElementById('rcLog');

  sseSource = new EventSource('/api/run/stream');
  sseSource.onmessage = async (e) => {
    if (e.data === '[DONE]') {
      sseSource.close(); sseSource = null;
      document.getElementById('activeRunCard').style.display = 'none';
      runs = await api('/api/runs');
      renderRuns();
      toast('Run completed', 'success');
      return;
    }
    if (e.data === '[IDLE]') { sseSource.close(); sseSource = null; return; }
    try {
      logEl.textContent += JSON.parse(e.data);
      logEl.scrollTop = logEl.scrollHeight;
    } catch {}
  };
  sseSource.onerror = () => { if (sseSource) { sseSource.close(); sseSource = null; } };
}

/* ===== PLANS ===== */
function renderPlans() {
  const w = document.getElementById('plansWrap');
  if (!plans.length) { w.innerHTML = '<div class="empty">No plans yet</div>'; return; }
  const gmap = Object.fromEntries(groups.map(g => [g.id, g.label]));
  w.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Name</th><th>Groups</th><th>Browser</th><th>Created</th><th>Actions</th></tr></thead>
    <tbody>${plans.map(p => {
      const gl = (p.groups || []).map(id => gmap[id] || id).join(', ') ||
        '<em style="opacity:.5">No groups</em>';
      return `<tr style="cursor:pointer" onclick="openPlanDetail('${esc(p.id)}')">
        <td><strong>${esc(p.name)}</strong></td>
        <td class="c-muted" style="font-size:13px">${gl}</td>
        <td class="c-muted">${bicon(p.browser)} ${esc(p.browser || 'all')}</td>
        <td class="c-muted" style="font-size:12px">${fdate(p.createdAt)}</td>
        <td onclick="event.stopPropagation()" style="width:1px">
          <div style="display:flex;gap:6px">
            <button class="btn btn-primary btn-sm" onclick="runPlanById('${esc(p.id)}')">▶ Run</button>
            <button class="btn btn-ghost btn-sm" onclick="openPlanDetail('${esc(p.id)}')">Edit</button>
          </div>
        </td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

async function openPlanDetail(id) {
  const plan = await api(`/api/plans/${id}`);
  currentPlanId = id;
  document.getElementById('plans-list').style.display = 'none';
  document.getElementById('plans-detail').style.display = 'block';
  document.getElementById('pdName').textContent = plan.name;
  document.getElementById('pdDesc').textContent = plan.description || '';
  document.getElementById('pdBrowser').value = plan.browser || 'all';

  const sel = new Set(plan.groups || []);
  document.getElementById('pdGroups').innerHTML = groups.map(g => {
    const tItems = (g.tests || []).map(t => `<div class="group-test">${esc(t)}</div>`).join('');
    return `<div class="group-item">
      <div class="group-hdr">
        <input type="checkbox" id="pdg-${g.id}" data-gid="${g.id}" ${sel.has(g.id) ? 'checked' : ''}>
        <label for="pdg-${g.id}" class="group-lbl">${esc(g.label)}</label>
        <span class="group-count">${(g.tests || []).length} tests</span>
      </div>
      ${tItems ? `<div class="group-tests">${tItems}</div>` : ''}
    </div>`;
  }).join('');
}

function closePlanDetail() {
  document.getElementById('plans-list').style.display = 'block';
  document.getElementById('plans-detail').style.display = 'none';
  currentPlanId = null;
}

async function savePlanDetail() {
  if (!currentPlanId) return;
  const selGroups = [...document.querySelectorAll('#pdGroups input[type=checkbox]:checked')]
    .map(el => el.dataset.gid);
  const browser = document.getElementById('pdBrowser').value;
  await api(`/api/plans/${currentPlanId}`, 'PUT', { groups: selGroups, browser });
  plans = await api('/api/plans');
  toast('Saved', 'success');
}

async function runPlanDetail() {
  if (!currentPlanId) return;
  const plan = plans.find(p => p.id === currentPlanId);
  closePlanDetail();
  navigate('runs');
  await runPlanById(currentPlanId);
}

async function deletePlanDetail() {
  if (!currentPlanId || !confirm('Delete this plan?')) return;
  await api(`/api/plans/${currentPlanId}`, 'DELETE');
  plans = plans.filter(p => p.id !== currentPlanId);
  closePlanDetail();
  renderPlans();
  toast('Deleted', 'success');
}

async function runPlanById(id) {
  const plan = plans.find(p => p.id === id);
  if (!plan?.groups?.length) { toast('This plan has no test groups configured', 'error'); return; }
  try {
    await api(`/api/plans/${id}/run`, 'POST', { browser: plan.browser || 'all' });
    showRunCard(plan.name, plan.browser || 'all');
    connectSSE();
    navigate('runs');
    runs = await api('/api/runs');
    renderRuns();
    toast('Run started', 'success');
  } catch(e) { toast(e.message || 'Failed', 'error'); }
}

async function openNewPlanModal() {
  document.getElementById('npName').value = '';
  document.getElementById('npDesc').value = '';
  document.querySelectorAll('#npBpills .bpill').forEach(b =>
    b.classList.toggle('active', b.dataset.b === 'chrome'));
  document.getElementById('npGroups').innerHTML = groups.map(g => {
    const tItems = (g.tests || []).map(t => `<div class="group-test">${esc(t)}</div>`).join('');
    return `<div class="group-item">
      <div class="group-hdr">
        <input type="checkbox" id="npg-${g.id}" data-gid="${g.id}">
        <label for="npg-${g.id}" class="group-lbl">${esc(g.label)}</label>
        <span class="group-count">${(g.tests || []).length} tests</span>
      </div>
      ${tItems ? `<div class="group-tests">${tItems}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('newPlanModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('npName').focus(), 50);
}
function closeNewPlanModal() { document.getElementById('newPlanModal').classList.add('hidden'); }

async function createPlan() {
  const name = document.getElementById('npName').value.trim();
  if (!name) { toast('Name required', 'error'); return; }
  const selGroups = [...document.querySelectorAll('#npGroups input:checked')].map(el => el.dataset.gid);
  const browser = document.querySelector('#npBpills .bpill.active')?.dataset.b || 'chrome';
  const desc = document.getElementById('npDesc').value.trim();
  const plan = await api('/api/plans', 'POST', { name, description: desc, browser, groups: selGroups });
  plans.push(plan);
  closeNewPlanModal();
  renderPlans();
  toast('Plan created', 'success');
}

/* ===== AUTOTESTS ===== */
async function loadAutotests() {
  autotests = await api('/api/autotests');
  renderAutotests();
  if (!monacoReady) initMonaco();
}

function renderAutotests() {
  const w = document.getElementById('atWrap');
  if (!autotests.length) {
    w.innerHTML = '<div class="empty"><div class="empty-ico">⌨</div>No autotests yet. Click New Autotest to create one.</div>';
    return;
  }
  w.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Name</th><th>Language</th><th>Created</th><th>Modified</th><th>Actions</th></tr></thead>
    <tbody>${autotests.map((t, i) => `<tr style="cursor:pointer" onclick="openAtDetail('${esc(t.id)}')">
      <td class="c-muted">${i + 1}</td>
      <td><strong>${esc(t.name)}</strong></td>
      <td class="c-muted">${esc(t.language || 'javascript')}</td>
      <td class="c-muted" style="font-size:12px">${fdate(t.createdAt)}</td>
      <td class="c-muted" style="font-size:12px">${fdate(t.updatedAt)}</td>
      <td onclick="event.stopPropagation()" style="width:1px">
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="openAtDetail('${esc(t.id)}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteAt('${esc(t.id)}')">Delete</button>
        </div>
      </td>
    </tr>`).join('')}
    </tbody></table></div>`;
}

function initMonaco() {
  if (monacoReady || typeof require === 'undefined') return;
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });
  require(['vs/editor/editor.main'], () => { monacoReady = true; });
}

async function openAtDetail(id) {
  const at = autotests.find(t => t.id === id) || await api(`/api/autotests/${id}`);
  currentAtId = id;
  document.getElementById('at-list').style.display = 'none';
  document.getElementById('at-detail').style.display = 'block';
  document.getElementById('atRunResult').style.display = 'none';
  document.getElementById('atName').value = at.name;
  document.getElementById('atLang').value = at.language || 'javascript';

  if (monacoEditor) { monacoEditor.dispose(); monacoEditor = null; }

  const spawnEditor = () => {
    const lang = (at.language || 'javascript') === 'python' ? 'python' : 'javascript';
    monacoEditor = monaco.editor.create(document.getElementById('monacoContainer'), {
      value: at.code || defaultCode(at.name),
      language: lang,
      theme: 'vs-dark',
      minimap: { enabled: false },
      fontSize: 13,
      scrollBeyondLastLine: false,
      wordWrap: 'on',
      automaticLayout: true,
      padding: { top: 12, bottom: 12 },
    });
  };

  if (monacoReady) {
    spawnEditor();
  } else {
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });
    require(['vs/editor/editor.main'], () => { monacoReady = true; spawnEditor(); });
  }
}

function closeAtDetail() {
  document.getElementById('at-list').style.display = 'block';
  document.getElementById('at-detail').style.display = 'none';
  currentAtId = null;
  if (monacoEditor) { monacoEditor.dispose(); monacoEditor = null; }
}

function updateEditorLang() {
  if (!monacoEditor) return;
  const lang = document.getElementById('atLang').value;
  monaco.editor.setModelLanguage(monacoEditor.getModel(), lang === 'python' ? 'python' : 'javascript');
}

async function createAutotest() {
  const name = prompt('Autotest name:');
  if (!name?.trim()) return;
  const at = await api('/api/autotests', 'POST', { name: name.trim() });
  autotests.unshift(at);
  renderAutotests();
  openAtDetail(at.id);
}

async function saveAutotest() {
  if (!currentAtId) return;
  const name = document.getElementById('atName').value.trim();
  const language = document.getElementById('atLang').value;
  const code = monacoEditor ? monacoEditor.getValue() : '';
  const updated = await api(`/api/autotests/${currentAtId}`, 'PUT', { name, language, code });
  const idx = autotests.findIndex(t => t.id === currentAtId);
  if (idx !== -1) autotests[idx] = updated;
  toast('Saved', 'success');
}

async function runAutotestNow() {
  if (!currentAtId) return;
  await saveAutotest();
  const btn = document.getElementById('atRunBtn');
  btn.disabled = true; btn.textContent = '⏳ Running…';
  const logEl = document.getElementById('atRunLog');
  document.getElementById('atRunResult').style.display = 'block';
  logEl.textContent = 'Running autotest…\n';
  try {
    const res = await api(`/api/autotests/${currentAtId}/run`, 'POST', {});
    logEl.textContent = res.output || '(no output)';
    logEl.scrollTop = logEl.scrollHeight;
    toast(res.status === 'passed' ? '✓ Test passed' : '✗ Test failed',
      res.status === 'passed' ? 'success' : 'error');
  } catch(e) {
    logEl.textContent = e.message || 'Run failed';
    toast('Run failed', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '▶ Run';
  }
}

async function deleteAt(id) {
  if (!confirm('Delete this autotest?')) return;
  await api(`/api/autotests/${id}`, 'DELETE');
  autotests = autotests.filter(t => t.id !== id);
  renderAutotests();
  toast('Deleted', 'success');
}

async function deleteAtCurrent() {
  if (!currentAtId || !confirm('Delete this autotest?')) return;
  await api(`/api/autotests/${currentAtId}`, 'DELETE');
  autotests = autotests.filter(t => t.id !== currentAtId);
  closeAtDetail();
  renderAutotests();
  toast('Deleted', 'success');
}

/* ===== HISTORY ===== */
async function loadHistory() {
  const allRuns = await api('/api/runs');
  renderHistory(allRuns);
}

function renderHistory(allRuns) {
  const w = document.getElementById('histWrap');
  if (!allRuns.length) { w.innerHTML = '<div class="empty">No history yet</div>'; return; }

  let tbody = '';
  allRuns.forEach((r, i) => {
    const hasRes = r.results && r.results.length > 0;
    tbody += `<tr class="${hasRes ? 'expandable' : ''}" onclick="${hasRes ? `toggleHist('${r.id}')` : ''}">
      <td class="c-muted">${allRuns.length - i}</td>
      <td>
        <strong>${esc(r.group || 'All Tests')}</strong>
        ${hasRes ? `<span class="exc" id="exc-${r.id}"> ▶</span>` : ''}
      </td>
      <td class="c-muted">${bicon(r.browser)} ${esc(r.browser || 'all')}</td>
      <td>${sbadge(r.status)}</td>
      <td class="c-green">${r.passed ?? '—'}</td>
      <td class="c-red">${r.failed ?? '—'}</td>
      <td class="c-muted">${r.duration || '—'}</td>
      <td class="c-muted" style="font-size:12px">${fdate(r.startedAt)}</td>
      <td class="c-muted">${esc(r.triggeredBy || '—')}</td>
    </tr>`;

    if (hasRes) {
      const tRows = r.results.map(t => `<tr>
        <td>${t.status === 'passed'
          ? '<span class="c-green">✓</span>'
          : '<span class="c-red">✗</span>'}</td>
        <td style="font-size:13px">${esc(t.title || '')}</td>
        <td class="c-muted" style="font-size:12px">${esc(t.browser || '')}</td>
        <td class="c-muted" style="font-size:12px">${esc(t.duration || '')}</td>
      </tr>`).join('');
      tbody += `<tr class="expand-row" id="ehist-${r.id}" style="display:none">
        <td colspan="9">
          <div class="expand-inner">
            <table class="results-table">
              <thead><tr><th>Status</th><th>Test</th><th>Browser</th><th>Duration</th></tr></thead>
              <tbody>${tRows}</tbody>
            </table>
          </div>
        </td>
      </tr>`;
    }
  });

  w.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Plan</th><th>Browser</th><th>Status</th><th>✓</th><th>✗</th><th>Duration</th><th>Started</th><th>By</th></tr></thead>
    <tbody>${tbody}</tbody>
  </table></div>`;
}

function toggleHist(runId) {
  const row = document.getElementById(`ehist-${runId}`);
  const exc = document.getElementById(`exc-${runId}`);
  if (!row) return;
  const open = row.style.display !== 'none';
  row.style.display = open ? 'none' : '';
  if (exc) exc.textContent = open ? ' ▶' : ' ▼';
}

/* ===== SHARED ===== */
function pickBrowser(el, cid) {
  document.querySelectorAll(`#${cid} .bpill`).forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  if (cid === 'runBpills') runBrowser = el.dataset.b;
}

async function logout() {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

/* ===== HELPERS ===== */
async function api(url, method = 'GET', body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ error: r.statusText }));
    throw new Error(err.error || r.statusText);
  }
  return r.json();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fdate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('uk-UA', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
    d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
}

function sbadge(s) {
  const cls = s === 'passed' ? 'badge-passed' : s === 'failed' ? 'badge-failed' : 'badge-running';
  const ico = s === 'passed' ? '✓' : s === 'failed' ? '✗' : '⏳';
  return `<span class="badge ${cls}">${ico} ${esc(s || 'running')}</span>`;
}

function bicon(b) {
  return b === 'chrome' ? '🌐' : b === 'firefox' ? '🦊' : '🖥️';
}

function defaultCode(name) {
  return `const { test, expect } = require('@playwright/test');\n\ntest('${name}', async ({ page }) => {\n  // TODO: implement your test\n  await page.goto('https://wearetheguild.co/');\n  await expect(page).toHaveTitle(/Guild/i);\n});\n`;
}

init();
</script>
