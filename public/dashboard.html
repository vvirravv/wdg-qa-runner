<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDG QA Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{
  --bg:#f0f2f7;--surface:#ffffff;--surface2:#f5f7fb;--border:#e2e8f2;
  --text:#1a202c;--text2:#6b7a99;--accent:#4f46e5;--accent-h:#4338ca;
  --green:#16a34a;--red:#dc2626;--yellow:#d97706;
  --sw:230px;
}
body{background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s ease;box-shadow:1px 0 0 var(--border)}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .brand-sub,.sidebar.collapsed .nav-item span,.sidebar.collapsed .user-info,.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0}
.sidebar.collapsed .brand{padding:16px 0;display:flex;justify-content:center}
.sidebar.collapsed .brand-name{display:none}
.sidebar.collapsed .sidebar-foot{padding:12px 0;justify-content:center}
.sidebar.collapsed .btn-logout{margin:0}
.toggle-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:4px 6px;border-radius:6px;transition:all .15s;line-height:0;flex-shrink:0}
.toggle-btn:hover{background:var(--surface2);color:var(--text)}
.main{flex:1;overflow-y:auto}

/* Sidebar */
.brand{padding:20px 20px 12px}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--text2);margin-top:2px}
.nav{flex:1;padding:4px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:14px;font-weight:500;text-decoration:none;transition:all .15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(91,138,245,.15);color:var(--accent)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;margin-top:2px}
.role-admin{color:var(--accent)}
.role-user{color:var(--text2)}
.btn-logout{background:none;border:none;cursor:pointer;color:var(--text2);padding:6px;border-radius:6px;transition:all .15s;display:flex;align-items:center}
.btn-logout:hover{background:var(--surface2);color:var(--red)}

/* Pages */
.page{padding:32px 36px}
.page.hidden{display:none}
.ph{display:flex;align-items:center;margin-bottom:28px}
.ph h1{font-size:22px;font-weight:700;flex:1}
.ph-actions{display:flex;gap:10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-h)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 12px;font-size:13px}

/* Tables */
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover:not(.expand-row){background:var(--surface)}
tbody td{padding:13px 16px;font-size:14px;vertical-align:middle}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-passed{background:rgba(34,197,94,.12);color:var(--green)}
.badge-failed{background:rgba(239,68,68,.12);color:var(--red)}
.badge-running{background:rgba(245,158,11,.12);color:var(--yellow)}
.badge-review{background:rgba(245,158,11,.12);color:var(--yellow)}

/* Active run card */
.run-card{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.04);border-radius:10px;padding:20px;margin-bottom:28px}
.run-card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.run-dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.run-card-title{font-size:15px;font-weight:600;flex:1}
.run-card-sub{font-size:13px;color:var(--text2)}
.rc-counter{font-size:13px;color:var(--text2);flex-shrink:0}
.rc-tests{display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto;margin-bottom:10px}
.rc-test-row{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:6px;background:rgba(0,0,0,.03);font-size:13px}
.rc-test-row .rc-icon{flex-shrink:0;width:16px;text-align:center}
.rc-test-row .rc-test-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-test-row .rc-dur{font-size:11px;color:var(--text2);flex-shrink:0}
.rc-test-row.rc-ok .rc-icon{color:var(--green)}
.rc-test-row.rc-fail .rc-icon{color:var(--red)}
.rc-test-row.rc-running .rc-icon{color:var(--yellow)}
.rc-log-toggle{background:none;border:none;cursor:pointer;color:var(--text2);font-size:12px;padding:0;text-decoration:underline;opacity:.7;transition:opacity .15s}
.rc-log-toggle:hover{opacity:1}

/* Log */
.log{background:#1e2130;border:1px solid #2d3250;border-radius:8px;padding:14px 16px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:#c8d0e0;line-height:1.7;height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.log-sm{height:180px}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;min-width:460px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;margin-bottom:22px}
.modal-title{font-size:18px;font-weight:700;flex:1}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:24px;line-height:1;padding:2px;border-radius:4px;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px}

/* Autotest accordion cards */
.at-cards{display:flex;flex-direction:column;gap:8px}
.at-card{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;transition:border-color .15s}
.at-card:hover{border-color:rgba(79,70,229,.25)}
.at-card-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.at-card-main{flex:1;min-width:0}
.at-card-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.35}
.at-run-status{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:12px}
.at-eye-btn{background:none;border:none;cursor:pointer;padding:0 2px;font-size:13px;line-height:1;opacity:.6;transition:opacity .15s;vertical-align:middle}
.at-eye-btn:hover{opacity:1}
.log-modal .modal{max-width:820px;width:95vw;max-height:88vh;display:flex;flex-direction:column}
.log-modal .modal-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.log-modal .log{height:auto;flex:1;min-height:200px;max-height:60vh}
.at-status-none{color:var(--text2)}
.at-status-ok{color:var(--green)}
.at-status-fail{color:var(--red)}
.at-status-warn{color:var(--yellow)}
.at-card-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.at-expand-arrow{font-size:14px;color:var(--text2);transition:transform .2s;flex-shrink:0;width:20px;text-align:center}
.at-expand-arrow.open{transform:rotate(180deg)}
.at-card-body{border-top:1px solid var(--border);padding:14px 16px;background:var(--surface2)}
.at-card-desc{font-size:13px;color:var(--text2);margin:0 0 12px;line-height:1.6}
.at-what-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
.at-what-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
.at-what-list li{font-size:12px;color:var(--text);padding:5px 10px;background:var(--bg);border-radius:6px;line-height:1.5}
.at-what-list li::before{content:"▸ ";color:var(--accent);font-size:10px}

/* Browser pills */
.bpills{display:flex;gap:8px;flex-wrap:wrap}
.bpill{padding:6px 16px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;background:none}
.bpill.active{border-color:var(--accent);color:var(--accent);background:rgba(91,138,245,.1)}
/* run type cards */
.run-type-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;transition:border-color .2s}
.run-type-card:hover{border-color:rgba(79,70,229,.25);background:rgba(79,70,229,.02)}
.run-type-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.run-type-body{flex:1;min-width:0}
.run-type-title{font-size:14px;font-weight:600;margin-bottom:3px}
.run-type-desc{font-size:12px;color:var(--text2);line-height:1.4;margin-bottom:10px}
.run-type-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.run-type-meta{font-size:12px;color:var(--text2);white-space:nowrap}
.run-launch-btn{padding:7px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap;color:#fff;margin-left:auto}
.run-launch-btn:hover{opacity:.88;transform:translateY(-1px)}
.run-launch-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.run-launch-btn-auto{background:var(--accent);box-shadow:0 2px 10px rgba(99,102,241,.3)}
.run-launch-btn-visual{background:linear-gradient(135deg,#7c3aed,#6366f1);box-shadow:0 2px 10px rgba(124,58,237,.35)}
.headed-lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}

/* Groups */
.groups-list{display:flex;flex-direction:column;gap:10px}
.group-item{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.group-hdr{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface2)}
.group-hdr input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.group-lbl{font-size:14px;font-weight:600;flex:1;cursor:pointer}
.group-count{font-size:12px;color:var(--text2)}
.group-tests{padding:8px 14px 10px 42px;display:flex;flex-direction:column;gap:3px}
.group-test{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.group-test::before{content:'·';color:var(--border)}

/* Detail view */
.detail-back{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:14px;cursor:pointer;background:none;border:none;margin-bottom:22px;padding:0;transition:color .15s}
.detail-back:hover{color:var(--text)}
.detail-back svg{width:15px;height:15px}
.detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.detail-hdr h2{font-size:20px;font-weight:700;flex:1}

/* Editor */
.editor-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;height:430px}
#monacoContainer{height:100%}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:8px;font-size:14px;font-weight:500;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:tIn .2s ease}
.t-success{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.t-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.t-info{background:rgba(91,138,245,.15);border:1px solid rgba(91,138,245,.3);color:var(--accent)}
.t-warning{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--yellow)}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Misc */
.empty{text-align:center;padding:56px 20px;color:var(--text2);font-size:14px}
.empty-ico{font-size:36px;margin-bottom:10px}
.c-muted{color:var(--text2)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-yellow{color:var(--yellow)}
.expand-row td{padding:0}
.expand-inner{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface)}
.results-table{width:100%;border-collapse:collapse}
.results-table th{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;padding:6px 10px;text-align:left}
.results-table td{padding:7px 10px;font-size:13px;border-top:1px solid var(--border)}
.expandable{cursor:pointer}
.exc{color:var(--text2);font-size:11px;user-select:none}
.lbl-sec{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}

/* Toggle switch */
.sw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-track{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:.2s;cursor:pointer}
.sw-track::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked + .sw-track{background:var(--accent)}
.sw input:checked + .sw-track::before{transform:translateX(18px)}
.sw input:disabled + .sw-track{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">
    <div style="display:flex;align-items:center;gap:8px">
      <div>
        <div class="brand-name">WDG QA</div>
        <div class="brand-sub">Autotest Management</div>
      </div>
      <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle sidebar" style="margin-left:auto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-item" data-page="autotests" onclick="navigate('autotests')" title="Репозиторій">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h6l2 3h10a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
      <span class="nav-label">Репозиторій</span>
    </button>
    <button class="nav-item" data-page="plans" onclick="navigate('plans')" title="Тест-плани">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span class="nav-label">Тест-плани</span>
    </button>
    <button class="nav-item" data-page="history" onclick="navigate('history')" title="Історія">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="nav-label">Історія</span>
    </button>
    <button id="navUsers" class="nav-item admin-only" data-page="users" onclick="navigate('users')" title="Користувачі" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span class="nav-label">Користувачі</span>
    </button>
  </nav>
  <div class="sidebar-foot">
    <div class="user-info">
      <div class="user-name" id="uName">—</div>
      <div class="user-role"><span id="uRole">—</span></div>
    </div>
    <button class="btn-logout" onclick="logout()" title="Sign out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- GLOBAL ACTIVE RUN CARD (visible on any page while a run is in progress) -->
<div id="activeRunCard" class="run-card" style="display:none;margin:20px 20px 0">
    <div class="run-card-hdr">
      <div class="run-dot"></div>
      <div style="flex:1">
        <div class="run-card-title" id="rcTitle">Running...</div>
        <div class="run-card-sub" id="rcSub"></div>
      </div>
      <div class="rc-counter" id="rcCounter"></div>
    </div>
    <div class="rc-tests" id="rcTests"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button onclick="stopCurrentRun()" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:500">⬛ Зупинити</button>
      <button class="rc-log-toggle" id="rcLogToggle" onclick="toggleRcLog()">Деталі ▸</button>
    </div>
    <div class="log" id="rcLog" style="display:none;margin-top:8px"></div>
  </div>
<!-- PLANS PAGE -->
<div id="page-plans" class="page hidden">
  <div id="plans-list">
    <div class="ph">
      <h1>Тест-плани</h1>
      <div class="ph-actions">
        <button class="btn btn-ghost admin-only" onclick="document.getElementById('xlsxFileInput').click()" style="display:none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Імпорт XLSX
        </button>
        <button class="btn btn-primary admin-only" onclick="openNewPlanModal()" style="display:none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Plan
        </button>
      </div>
    </div>
    <div id="plansWrap"><div class="empty">No plans yet</div></div>
  </div>
  <div id="plans-detail" style="display:none">
    <button class="detail-back" onclick="closePlanDetail()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Тест-плани
    </button>
    <div class="detail-hdr" style="margin-bottom:6px">
      <h2 id="pdName" style="flex:1;margin:0;font-size:18px"></h2>

<!-- Monaco CDN -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
<script>
'use strict';

/* ===== STATE ===== */
let currentUser = { username: '', role: 'user', canRunAutotests: false };
let plans = [];
let runs = [];
let autotests = [];
let currentPlanId = null;
let currentAtId = null;
const atLastRun = {};
let monacoReady = false;
let monacoEditor = null;
let sseSource = null;
let runBrowser = 'all';

/* ===== INIT ===== */
async function init() {
  try {
    currentUser = await api('/api/me');
    document.getElementById('uName').textContent = currentUser.username;
    const roleEl = document.getElementById('uRole');
    const role = currentUser.role || 'user';
    roleEl.textContent = role;
    roleEl.className = role === 'admin' ? 'role-admin' : 'role-user';

    if (role === 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
    }
    plans = await api('/api/plans');

    const pages = ['plans', 'autotests', 'history', 'users'];
    const hash = location.hash.replace('#', '');
    navigate(pages.includes(hash) ? hash : 'plans');
  } catch { window.location.href = '/login'; }
}

/* ===== NAVIGATION ===== */
function navigate(page) {
  if (page === 'users' && currentUser.role !== 'admin') return;

  location.hash = page;
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  document.querySelectorAll('.page').forEach(el =>
    el.classList.toggle('hidden', el.id !== `page-${page}`));

  if (page === 'plans')     renderPlans();
  if (page === 'autotests') loadAutotests();
  if (page === 'history')   loadRuns();
  if (page === 'users')     loadUsers();
}

/* ===== RUNS ===== */
async function loadRuns() {
  runs = await api('/api/runs');
  renderRuns();
  try {
    const status = await api('/api/run/status');
    if (status.running) connectSSE();
  } catch {}
}

async function deleteRunById(id) {
  if (!await showConfirm('Видалити цей запуск з історії?')) return;
  await api(`/api/runs/${id}`, 'DELETE');
  runs = runs.filter(r => r.id !== id);
  renderRuns();
  toast('Видалено', 'success');
}

async function clearAllRuns() {
  if (!await showConfirm('Очистити всю історію запусків?')) return;
  await api('/api/runs', 'DELETE');
  runs = [];
  renderRuns();
  toast('Історію очищено', 'success');
}

function stripId(name) { return (name || '').replace(/^\[\d+\]\s*/, ''); }

function renderRuns() {
  const w = document.getElementById('runsWrap');
  if (!runs.length) {
    w.innerHTML = '<div class="empty"><div class="empty-ico">▷</div>Запусків ще немає. Натисни "Запустити" вище.</div>';
    return;
  }
  const isAdmin = currentUser?.role === 'admin';
  document.getElementById('clearHistoryBtn').style.display = isAdmin ? '' : 'none';
  w.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Тип</th><th>Браузер</th><th>Статус</th><th>Час</th><th>Дата</th><th>Хто</th>${isAdmin ? '<th></th>' : ''}</tr></thead>
    <tbody>${runs.map((r, i) => {
      const stale = r.status === 'running' && !sseSource;
      const total = (r.passed ?? 0) + (r.failed ?? 0);
      const counts = total > 0 ? ` <span style="font-size:11px;color:var(--text2)">${r.passed}/${total}</span>` : '';
      const badge = stale ? '<span class="badge badge-running" title="Можливо зависло">⚠ зависло?</span>' : sbadge(r.status);
      return `<tr>
        <td class="c-muted">${runs.length - i}</td>
        <td><strong>${esc(stripId(r.group) || 'Всі тести')}</strong></td>
        <td class="c-muted">${bicon(r.browser)} ${esc(r.browser || 'all')}</td>
        <td style="white-space:nowrap">${badge}${counts} <button class="at-eye-btn" onclick="showRunLog('${r.id}')" title="Лог запуску">👁</button></td>
        <td class="c-muted">${r.duration || '—'}</td>
        <td class="c-muted" style="font-size:12px">${fdate(r.startedAt)}</td>
        <td class="c-muted">${esc(r.triggeredBy || '—')}</td>
        ${isAdmin ? `<td><button class="at-eye-btn" onclick="deleteRunById('${r.id}')" title="Видалити запуск" style="color:var(--red)">✕</button></td>` : ''}
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

function openRunModal() {
  const sel = document.getElementById('runPlanSel');
  sel.innerHTML = '<option value="">— Select a plan —</option>' +
    plans.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  runBrowser = 'all';
  document.querySelectorAll('#runBpills .bpill').forEach(b =>
    b.classList.toggle('active', b.dataset.b === 'all'));
  document.getElementById('runModal').classList.remove('hidden');
}
function closeRunModal() { document.getElementById('runModal').classList.add('hidden'); }

async function startRun() {
  const planId = document.getElementById('runPlanSel').value;
  if (!planId) { toast('Select a test plan', 'error'); return; }
  const headed = !!document.getElementById('runHeadedToggle')?.checked;
  closeRunModal();
  try {
    const plan = plans.find(p => p.id === planId);
    await api(`/api/plans/${planId}/run`, 'POST', { browser: runBrowser, headed });
    showRunCard(plan?.name || planId, runBrowser);
    connectSSE();
    toast('Run started', 'success');
    runs = await api('/api/runs');
    renderRuns();
  } catch(e) { toast(e.message || 'Failed to start run', 'error'); }
}

function showRunCard(title, browser) {
  document.getElementById('activeRunCard').style.display = 'block';
  document.getElementById('rcTitle').textContent = title;
  const sub = (!browser || browser === 'all') ? 'Chrome + Firefox' : (browser.charAt(0).toUpperCase() + browser.slice(1));
  document.getElementById('rcSub').textContent = sub;
  document.getElementById('rcLog').textContent = '';
  document.getElementById('rcLog').style.display = 'none';
  document.getElementById('rcTests').innerHTML = '';
  document.getElementById('rcCounter').textContent = '';
  document.getElementById('rcLogToggle').textContent = 'Деталі ▸';
}

function toggleRcLog() {
  const log = document.getElementById('rcLog');
  const btn = document.getElementById('rcLogToggle');
  if (log.style.display === 'none') { log.style.display = 'block'; btn.textContent = 'Деталі ▴'; }
  else { log.style.display = 'none'; btn.textContent = 'Деталі ▸'; }
}

function toggleAtCode() {
  const wrap = document.getElementById('atFileEditorWrap');
  const btn = document.getElementById('atCodeToggleBtn');
  if (wrap.style.display === 'none') { wrap.style.display = 'block'; btn.textContent = 'Приховати код ▴'; }
  else { wrap.style.display = 'none'; btn.textContent = 'Показати код ▸'; }
}

async function stopCurrentRun() {
  try {
    await api('/api/run/stop', 'POST');
    toast('Запуск зупинено', 'info');
  } catch(e) { toast(e.message || 'Не вдалось зупинити', 'error'); }
}

function connectSSE() {
  if (sseSource) { sseSource.close(); sseSource = null; }
  const logEl = document.getElementById('rcLog');
  const testsEl = document.getElementById('rcTests');
  const counterEl = document.getElementById('rcCounter');
  const testMap = new Map();
  let lineBuffer = '';
  let passedCnt = 0, totalCnt = 0;

  function parseLine(line) {
    // Playwright list reporter: "  ✓  [chromium] › ..." or "  ✓  3 [visual] › ..."
    const m = line.match(/^\s+([✓✗×✘])\s+(?:\d+\s+)?\[([^\]]+)\]\s+›.*?›\s+([^(\n]+?)(?:\s+\([\d.]+(?:ms|s|m)\))?\s*$/);
    if (!m) return null;
    const ok = m[1] === '✓';
    const title = m[3].replace(/\s*\(retry #\d+\)\s*$/, '').trim();
    const durM = line.match(/\((\d+(?:\.\d+)?(?:ms|s|m))\)\s*$/);
    return { ok, title, dur: durM ? durM[1] : '' };
  }

  function renderTest(result) {
    const { ok, title, dur } = result;
    const key = title;
    const cls = ok ? 'rc-ok' : 'rc-fail';
    const icon = ok ? '✓' : '✗';
    if (testMap.has(key)) {
      const row = testMap.get(key);
      row.className = `rc-test-row ${cls}`;
      row.querySelector('.rc-icon').textContent = icon;
      row.querySelector('.rc-dur').textContent = dur;
    } else {
      const row = document.createElement('div');
      row.className = `rc-test-row ${cls}`;
      row.innerHTML = `<span class="rc-icon">${icon}</span><span class="rc-test-name">${esc(title)}</span><span class="rc-dur">${esc(dur)}</span>`;
      testsEl.appendChild(row);
      testsEl.scrollTop = testsEl.scrollHeight;
      testMap.set(key, row);
      if (ok) passedCnt++;
      totalCnt++;
      counterEl.textContent = `${passedCnt} / ${totalCnt}`;
    }
  }

  sseSource = new EventSource('/api/run/stream');
  sseSource.onmessage = async (e) => {
    if (e.data === '[DONE]') {
      sseSource.close(); sseSource = null;
      document.getElementById('activeRunCard').style.display = 'none';
      runs = await api('/api/runs');
      renderRuns();
      const r = runs[0];
      if (r) {
        if (r.status === 'passed' && r.passed > 0) toast(`✅ Всі ${r.passed} тестів пройшли`, 'success');
        else if (r.status === 'passed' && !r.passed) toast(`❌ Жоден тест не запустився — перевір логи`, 'error');
        else if (r.status === 'review') toast(`⚠️ ${r.review} ${r.review === 1 ? 'сторінка відрізняється' : 'сторінок відрізняються'} від Figma-макету — дивись нижче`, 'warning');
        else toast(`❌ ${r.failed} ${r.failed === 1 ? 'тест не пройшов' : 'тестів не пройшло'} — дивись нижче`, 'error');
        if (r.results?.length) setTimeout(() => {
          toggleHist(r.id);
          document.getElementById(`ehist-${r.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      }
      return;
    }
    if (e.data === '[IDLE]') { sseSource.close(); sseSource = null; return; }
    try {
      const text = JSON.parse(e.data);
      logEl.textContent += text;
      logEl.scrollTop = logEl.scrollHeight;
      lineBuffer += text;
      const parts = lineBuffer.split('\n');
      lineBuffer = parts.pop();
      for (const line of parts) {
        const result = parseLine(line);
        if (result) renderTest(result);
      }
    } catch {}
  };
  sseSource.onerror = () => { if (sseSource) { sseSource.close(); sseSource = null; } };
}

/* ===== XLSX IMPORT ===== */
let xlsxParsedSuites = [];

function handleXlsxFile(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  evt.target.value = '';
  if (typeof XLSX === 'undefined') { toast('Бібліотека XLSX не завантажена — перевір з\'єднання', 'error'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const tcSheet = wb.Sheets['Test Cases'];
      if (!tcSheet) { toast('Аркуш "Test Cases" не знайдено в файлі', 'error'); return; }
      const rows = XLSX.utils.sheet_to_json(tcSheet);

      const stepsMap = {};
      const stSheet = wb.Sheets['classic'];
      if (stSheet) {
        for (const s of XLSX.utils.sheet_to_json(stSheet)) {
          const id = String(s['Case ID']);
          if (!stepsMap[id]) stepsMap[id] = [];
          if (s['Action'] || s['Expected Result'])
            stepsMap[id].push({ action: s['Action'] || '', expected: s['Expected Result'] || '' });
        }
      }

      const suitesMap = {};
      for (const row of rows) {
        const suite = row['Suite Title'] || 'Без категорії';
        if (!suitesMap[suite]) suitesMap[suite] = [];
        suitesMap[suite].push({
          externalId: String(row['ID']),
          title: row['Title'] || '',
          description: row['Description'] || '',
          preconditions: row['Preconditions'] || '',
          priority: row['Priority'] || '',
          severity: row['Severity'] || '',
          type: row['Type'] || '',
          tags: row['Tags'] || '',
          steps: stepsMap[String(row['ID'])] || []
        });
      }

      xlsxParsedSuites = Object.entries(suitesMap).map(([name, cases]) => ({ name, cases, selected: true }));
      if (!xlsxParsedSuites.length) { toast('Тест-кейсів не знайдено', 'error'); return; }
      renderXlsxPreview();
      document.getElementById('xlsxImportModal').classList.remove('hidden');
    } catch(err) { toast('Помилка читання файлу: ' + err.message, 'error'); }
  };
  reader.readAsArrayBuffer(file);
}

function renderXlsxPreview() {
  const existing = new Set(plans.map(p => p.name));
  document.getElementById('xlsxPreview').innerHTML = xlsxParsedSuites.map((suite, i) => {
    const dup = existing.has(suite.name);
    return `<div style="border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface2)">
        <input type="checkbox" ${suite.selected ? 'checked' : ''} style="width:15px;height:15px;cursor:pointer;flex-shrink:0"
          onchange="xlsxParsedSuites[${i}].selected=this.checked;updateXlsxCount()">
        <strong style="flex:1;font-size:14px">${esc(suite.name)}</strong>
        <span style="font-size:12px;color:var(--text2)">${suite.cases.length} тест${suite.cases.length===1?'':'и'}</span>
        ${dup ? '<span style="font-size:11px;color:var(--yellow);background:rgba(245,158,11,.15);padding:2px 8px;border-radius:10px;white-space:nowrap">вже існує</span>' : ''}
      </div>
      <div style="padding:6px 16px 8px">
        ${suite.cases.map(c=>`<div style="font-size:13px;padding:4px 0;display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--border)">
          <span style="font-size:11px;color:var(--text2);flex-shrink:0">#${c.externalId}</span>

        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  updateXlsxCount();
}

function renderAutotests() {
  const w = document.getElementById('atWrap');
  const q = (document.getElementById('atSearch')?.value || '').toLowerCase();
  const list = q ? autotests.filter(t =>
    t.name.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q)
  ) : autotests;
  if (!list.length) {
    w.innerHTML = q
      ? `<div class="empty">Нічого не знайдено за "${esc(q)}"</div>`
      : '<div class="empty"><div class="empty-ico">⌨</div>Автотестів ще немає.</div>';
    return;
  }
  const fmtRunTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('uk-UA', { day:'numeric', month:'short' })
      + ' ' + d.toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit' });
  };
  const statusBadge = (t) => {
    const lr = t.lastRun || atLastRun[t.id];
    if (!lr) return `<span class="at-run-status at-status-none">● Ще не запускали</span>`;
    const s = typeof lr === 'string' ? lr : lr.status;
    const time = typeof lr === 'object' && lr.time ? ' · ' + fmtRunTime(lr.time) : '';
    const hasMedia = typeof lr === 'object' && lr !== null;
    const eye = hasMedia ? ` <button class="at-eye-btn" onclick="event.stopPropagation();showLastOutput('${t.id}')" title="Переглянути запис останнього запуску">👁</button>` : '';
    if (s === 'passed') return `<span class="at-run-status at-status-ok">✓ Пройдено${time}${eye}</span>`;
    if (s === 'failed') return `<span class="at-run-status at-status-fail">✗ Не пройдено${time}${eye}</span>`;
    return `<span class="at-run-status at-status-warn">⏱ Тайм-аут${time}${eye}</span>`;
  };
  const whatTestedHtml = (t) => {
    const items = t.whatsTested || [];
    if (!items.length) return '';
    return `<div class="at-what-title">Що тестується</div>
      <ul class="at-what-list">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  };
  w.innerHTML = `<div class="at-cards">${list.map(t => `
    <div class="at-card" id="atcard-${esc(t.id)}">
      <div class="at-card-hdr" onclick="toggleAtDesc('${esc(t.id)}')">
        <div class="at-card-main">
          <div class="at-card-name">${esc(stripId(t.name))}</div>
          ${statusBadge(t)}
        </div>
        <div class="at-card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-primary btn-sm" onclick="runAtById('${esc(t.id)}')">▶ Запустити</button>
        </div>
        <div class="at-expand-arrow" id="atarrow-${esc(t.id)}">▾</div>
      </div>
      <div class="at-card-body" id="atbody-${esc(t.id)}" style="display:none">
        ${t.description ? `<p class="at-card-desc">${esc(t.description)}</p>` : ''}
        ${whatTestedHtml(t)}
      </div>

function humanizeError(msg) {
  if (/Executable doesn't exist/.test(msg) || /browserType\.launch/.test(msg)) {
    const b = msg.match(/ms-playwright\/(\w+)-/)?.[1] || 'браузер';
    return `${b} не встановлений на цьому комп'ютері`;
  }
  if (/Test timeout of (\d+)ms exceeded/.test(msg)) {
    const sec = (+msg.match(/(\d+)ms/)[1] / 1000).toFixed(0);
    return `Тест не завершився за ${sec} секунд (timeout)`;
  }
  if (/net::ERR_NAME_NOT_RESOLVED|net::ERR_CONNECTION_REFUSED|net::ERR_INTERNET_DISCONNECTED/.test(msg))
    return 'Сайт недоступний — перевір підключення або URL';
  if (/net::ERR_/.test(msg)) return 'Помилка мережі — сайт не відповів';
  if (/expect\(received\)/.test(msg) || /Expected.*Received/.test(msg))
    return 'Очікуваний результат не збігся з реальним';
  if (/waiting for locator|Locator/.test(msg)) return 'Елемент не знайдений на сторінці';
  if (/page\.goto|Navigation/.test(msg)) return 'Не вдалося перейти на сторінку';
  return msg.replace(/\/Users\/\S+\//g, '…/').replace(/\s+at\s+.+/g, '').slice(0, 120);
}

function parseFailureReasons(text) {
  const reasons = [];
  const parts = text.split(/\n\s+\d+\) /);
  for (let i = 1; i < parts.length; i++) {
    const lines = parts[i].split('\n').map(l => l.trim()).filter(Boolean);
    const browserM = (lines[0] || '').match(/\[(desktop-\w+|mobile-\w+)\]/);
    const browser = browserM ? browserM[1].replace('desktop-', '').replace('mobile-', '') : '';
    let msg = '';
    for (let j = 1; j < Math.min(lines.length, 20); j++) {
      const l = lines[j];
      if (!l || l.startsWith('at ') || l.startsWith('=') || l.match(/^-{3,}/)) continue;
      msg = humanizeError(l.replace(/^Error:\s*/, ''));
      break;
    }
    if (browser || msg) reasons.push({ browser, msg });
  }
  return reasons;
}

function showRunSummary(status, out, _vf) {
  const sumEl = document.getElementById('atRunSummary');
  if (status === 'timeout') {
    sumEl.style.cssText = 'display:block;margin-top:10px;padding:10px 16px;border-radius:8px;font-size:14px;background:rgba(234,179,8,.15);color:#eab308';
    sumEl.textContent = '⏱ Час вийшов — тест не завершився';
    if (currentAtId) { atLastRun[currentAtId] = { status: 'timeout', time: new Date().toISOString(), output: out, videoFile: _vf }; renderAutotests(); }
    return;
  }
  const passedM = out.match(/(\d+)\s+passed/);
  const failedM = out.match(/(\d+)\s+failed/);
  const passed = passedM ? +passedM[1] : 0;
  const failed = failedM ? +failedM[1] : 0;
  if (failed === 0 && passed > 0) {
    sumEl.style.cssText = 'display:block;margin-top:10px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;background:rgba(34,197,94,.15);color:#22c55e';
    sumEl.textContent = '✓ Пройдено';
    if (currentAtId) { atLastRun[currentAtId] = { status: 'passed', time: new Date().toISOString(), output: out, videoFile: _vf }; renderAutotests(); }
  } else {
    const reasons = parseFailureReasons(out);
    let html = `<div style="font-weight:600;margin-bottom:${reasons.length ? 8 : 0}px">✗ ${passed > 0 ? `Пройшло ${passed}, не пройшло ${failed}` : 'Не пройдено'}</div>`;
    for (const r of reasons)
      html += `<div style="font-size:13px;margin-top:4px;opacity:.9">${r.browser ? `<span style="font-weight:600">${r.browser}:</span> ` : ''}${esc(r.msg || 'невідома помилка')}</div>`;
    sumEl.style.cssText = 'display:block;margin-top:10px;padding:10px 16px;border-radius:8px;background:rgba(239,68,68,.15);color:#ef4444';
    sumEl.innerHTML = html;
    if (currentAtId) { atLastRun[currentAtId] = { status: 'failed', time: new Date().toISOString(), output: out, videoFile: _vf }; renderAutotests(); }
  }
}

async function runAutotestNow() {
  if (!currentAtId) return;
  const at = autotests.find(t => t.id === currentAtId);
  const isFileBased = !!(at?.specFile && at?.testName);
  if (!isFileBased) await saveAutotest(true);
  const btn = document.getElementById(isFileBased ? 'atRunBtn' : 'atRunBtnCode');
  btn.disabled = true; btn.textContent = '⏳ Running…';
  const logEl = document.getElementById('atRunLog');
  document.getElementById('atRunResult').style.display = 'block';
  logEl.textContent = '';
  document.getElementById('atRunSummary').style.display = 'none';
  const headed = !!(document.getElementById('atHeadedToggle')?.checked || document.getElementById('atHeadedToggleCode')?.checked);
  let fullOutput = '';
  try {
    const response = await fetch(`/api/autotests/${currentAtId}/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ headed }),
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || `Помилка ${response.status}`);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'output') {
            fullOutput += ev.text;
            logEl.textContent = fullOutput;
            logEl.scrollTop = logEl.scrollHeight;
          } else if (ev.type === 'done') {
            showRunSummary(ev.status, ev.output || fullOutput, ev.videoFile || null);
          }
        } catch {}
      }
    }
  } catch(e) {
    logEl.textContent = e.message || 'Run failed';
    document.getElementById('atRunSummary').style.display = 'none';
    toast('Запуск не вдався', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '▶ Запустити';
  }
}

/* ===== HISTORY (visual — legacy, kept for reference) ===== */
function renderHistory(allRuns) {
  const w = document.getElementById('histWrap');
  if (!w) return;
  if (!allRuns.length) { w.innerHTML = '<div class="empty">No history yet</div>'; return; }

  let tbody = '';
  allRuns.forEach((r, i) => {
    const hasRes = r.results && r.results.length > 0;
    const total = (r.passed ?? 0) + (r.failed ?? 0);
    const counts = total > 0 ? ` <span style="font-size:11px;color:var(--text2)">${r.passed}/${total}</span>` : '';
    tbody += `<tr class="${hasRes ? 'expandable' : ''}" onclick="${hasRes ? `toggleHist('${r.id}')` : ''}">
      <td class="c-muted">${allRuns.length - i}</td>
      <td>
        <strong>${esc(stripId(r.group) || 'Всі тести')}</strong>
        ${hasRes ? `<span class="exc" id="exc-${r.id}"> ▶</span>` : ''}
      </td>
      <td class="c-muted">${bicon(r.browser)} ${esc(r.browser || 'all')}</td>
      <td style="white-space:nowrap">${sbadge(r.status)}${counts} <button class="at-eye-btn" onclick="event.stopPropagation();showRunLog('${r.id}')" title="Лог запуску">👁</button></td>
      <td class="c-muted">${r.duration || '—'}</td>
      <td class="c-muted" style="font-size:12px">${fdate(r.startedAt)}</td>
      <td class="c-muted">${esc(r.triggeredBy || '—')}</td>
    </tr>`;

    if (hasRes) {
      const tRows = r.results.map(t => {
        const icon = t.status === 'passed' ? '<span class="c-green">✓</span>'
          : (t.status === 'design-mismatch' || t.status === 'no-baseline') ? '<span class="c-yellow">⚠</span>'
          : '<span class="c-red">✗</span>';
        const row = `<tr>
          <td>${icon}</td>
          <td style="font-size:13px">${esc(t.title || '')}</td>
          <td class="c-muted" style="font-size:12px">${esc(t.browser || '')}</td>
          <td class="c-muted" style="font-size:12px">${esc(t.duration || '')}</td>
        </tr>`;
        if (!t.visualDiff) return row;
        const vd = t.visualDiff;
        const thumb = (label, src) => !src ? '' : `
          <div>
            <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${label}</div>
            <img src="${src}" style="width:160px;border:1px solid var(--border);border-radius:4px;cursor:pointer;display:block" onclick="openLightbox('${src}')">
          </div>`;
        const sizeLine = t.status === 'design-mismatch'
          ? `<div style="font-size:12px;color:var(--text2);margin-bottom:10px">Макет: ${esc(vd.expectedSize)} · Сайт: ${esc(vd.actualSize)} · Відрізняється ${vd.diffPercent}% пікселів</div>`
          : '';
        const thumbs = t.status === 'design-mismatch'
          ? `${thumb('Очікувано (Figma)', vd.expected)}${thumb('Отримано (сайт)', vd.actual)}${thumb('Різниця', vd.diff)}`
          : thumb('Новий скрін сайту', vd.actual);
        return row + `<tr>
          <td></td>
          <td colspan="3" style="padding:0 10px 16px">
            <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px">
              <div style="font-size:13px;margin-bottom:4px">${esc(vd.message)}</div>
              ${sizeLine}
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:${sizeLine ? '0' : '10px'}">
                ${thumbs}
              </div>
            </div>
          </td>
        </tr>`;
      }).join('');
      tbody += `<tr class="expand-row" id="ehist-${r.id}" style="display:none">
        <td colspan="10">
          <div class="expand-inner">
            <table class="results-table">
              <thead><tr><th>Статус</th><th>Тест</th><th>Браузер</th><th>Час</th></tr></thead>
              <tbody>${tRows}</tbody>
            </table>
          </div>
        </td>
      </tr>`;
    }
  });

  w.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Тип</th><th>Браузер</th><th>Статус</th><th>Час</th><th>Дата</th><th>Хто</th></tr></thead>
    <tbody>${tbody}</tbody>
  </table></div>`;
}

/* ===== HELPERS ===== */
async function api(url, method = 'GET', body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ error: r.statusText }));
    throw new Error(err.error || r.statusText);
  }
  return r.json();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fdate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('uk-UA', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
    d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
}

function sbadge(s) {
  const cls = s === 'passed' ? 'badge-passed' : s === 'failed' ? 'badge-failed' : s === 'review' ? 'badge-review' : 'badge-running';
  const ico = s === 'passed' ? '✓' : s === 'failed' ? '✗' : s === 'review' ? '⚠' : '⏳';
  const label = s === 'passed' ? 'Пройдено' : s === 'failed' ? 'Не пройдено' : s === 'review' ? 'На огляд' : 'Запуск';
  return `<span class="badge ${cls}">${ico} ${label}</span>`;
}

async function showRunLog(id) {
  try {
    const r = await api(`/api/runs/${id}`);
    document.getElementById('logViewTitle').textContent = stripId(r.group) || 'Всі тести';

    const logsPane = document.getElementById('logViewBody');
    const videoPane = document.getElementById('logViewVideoPane');
    const tabsBar = document.getElementById('logViewTabs');

    logsPane.innerHTML = `<pre class="log" style="background:#1e1e2e;color:#cdd6f4;padding:16px;border-radius:8px;font-size:12px;white-space:pre-wrap">${esc(r.output || '(лог відсутній)')}</pre>`;

    if (r.videos?.length) {
      videoPane.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
        ${r.videos.map(v => {
          const name = v.split('/').pop().replace(/\.webm$|\.mp4$/, '');
          return `<div style="background:var(--surface2);border-radius:8px;overflow:hidden">
            <video src="${esc(v)}" controls style="width:100%;display:block;background:#000"></video>
            <div style="font-size:11px;color:var(--text2);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(name)}">${esc(name)}</div>
          </div>`;
        }).join('')}
      </div>`;
      tabsBar.style.display = 'block';
      switchLogTab('video');
    } else {
      tabsBar.style.display = 'none';
      logsPane.style.display = 'block';
      videoPane.style.display = 'none';
    }

    document.getElementById('logViewModal').classList.remove('hidden');
  } catch(e) { toast('Не вдалось завантажити лог', 'error'); }
}

function switchLogTab(tab) {
  const logsPane = document.getElementById('logViewBody');
  const videoPane = document.getElementById('logViewVideoPane');
  const btnVideo = document.getElementById('tabBtnVideo');
  const btnLogs = document.getElementById('tabBtnLogs');
  const isVideo = tab === 'video';
  videoPane.style.display = isVideo ? 'block' : 'none';
  logsPane.style.display = isVideo ? 'none' : 'block';
  btnVideo.style.borderBottom = isVideo ? '2px solid var(--accent)' : '2px solid transparent';
  btnVideo.style.color = isVideo ? 'var(--accent)' : 'var(--text2)';
  btnLogs.style.borderBottom = isVideo ? '2px solid transparent' : '2px solid var(--accent)';
  btnLogs.style.color = isVideo ? 'var(--text2)' : 'var(--accent)';
}

function bicon(b) {
  return b === 'chrome' ? '🌐' : b === 'firefox' ? '🦊' : '💻';
}

function defaultCode(name) {
  return `const { test, expect } = require('@playwright/test');\n\ntest('${name}', async ({ page }) => {\n  // TODO: implement your test\n  await page.goto('https://wearetheguild.co/');\n  await expect(page).toHaveTitle(/Guild/i);\n});\n`;
}

init();
</script>
